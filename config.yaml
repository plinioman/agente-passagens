# ---------------------------------------------------------------------------
# Configuracao do agente de monitoramento de passagens
# Tudo aqui e publico (nao ha segredos). Segredos ficam em GitHub Secrets:
#   TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, SMTP_PASSWORD
# ---------------------------------------------------------------------------
#
# Foco atual: trecho domestico de CONEXAO Belo Horizonte <-> Rio de Janeiro
# (GIG), para encaixar com o voo internacional GIG-JFK-GIG ja comprado.
#   Ida:   28/04/2027 — pousar em GIG com folga antes do voo intl (parte 21:55)
#   Volta: 11/05/2027 — sair de GIG umas 3-4h depois do pouso do intl (09:55)
# Datas fixas (nao ha flexibilidade aqui, precisam encaixar no voo ja comprado).

buscas:
  - origem: CNF
    destino: GIG
    data_ida: "2027-04-28"
    data_volta: "2027-05-11"
    # So informativo (a busca nao filtra por horario, o preco observado tem
    # sido igual em todos os horarios do dia); use para escolher o voo certo
    # na hora de comprar:
    horario_ida_sugerido: "~13:00 (pousa 14:05, ~7h50 de folga antes do voo intl)"
    horario_volta_sugerido: "~14:45 (sai ~4h50 depois do pouso do voo intl)"

viagem:
  passageiros_adultos: 3
  passageiros_criancas: 3
  classe: economy
  max_paradas: 1   # hoje so ha voo direto (Azul) nesse trecho

precos:
  # Alvo por pessoa
  alvo_por_pessoa_brl: 500
  # Alerta por queda percentual em relacao a media movel observada
  # (so passa a valer depois que acumular "dias_minimos_historico" de dados)
  queda_percentual: 0.15
  dias_minimos_historico: 7
  media_movel_dias: 45

varredura:
  pausa_entre_consultas_seg: 2

relatorio:
  # Horarios apenas informativos; o agendamento real esta em .github/workflows/report.yml
  # (11:00 e 18:00 UTC = 08:00 e 15:00 no horario de Brasilia)
  top_n: 10

email:
  ativo: true
  remetente: plinioo@gmail.com
  destinatario: plinioo@gmail.com
  smtp_host: smtp.gmail.com
  smtp_port: 587

moeda:
  # Cotacoes de fallback caso a API de cambio falhe (atualizar de vez em quando)
  fallback:
    USD: 5.40
    CAD: 3.90
    EUR: 5.80
