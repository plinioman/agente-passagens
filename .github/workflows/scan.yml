name: scan

on:
  schedule:
    - cron: "7 * * * *"        # toda hora, aos :07 (evita o congestionamento do :00)
  workflow_dispatch: {}         # permite rodar manualmente pela aba Actions

permissions:
  contents: write               # para commitar data/ de volta

concurrency:
  group: agente-passagens       # nunca roda scan e report ao mesmo tempo
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache do navegador Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Varredura
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m src.main

      - name: Commitar dados
        run: |
          git config user.name "agente-passagens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "sem mudancas em data/"
          else
            git commit -m "dados: scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
